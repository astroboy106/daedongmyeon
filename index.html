/* VOICE: 조용한 개인 기록장. 슴슴한 육수처럼 담백

:root{color-scheme:light dark;--bg:light-dark(#fff,#151513);--ink:light-dark(#1f1d1a,#ece8e0);--soft:light-dark(#6d665b,#a9a296);--line:light-dark(#e6e2da,#2e2c28);--buck:light-dark(#efebe3,#211f1c);--land:light-dark(#f4f1eb,#2b2824);--brass:light-dark(#a7802f,#d2a74c);--pink:light-dark(#c9506b,#e07890);--mil:light-dark(#3f8f5a,#6cc28a);--water:light-dark(#b9d6df,#243940);--card:light-dark(#fff,#1c1b19);--park:light-dark(#dfe8d3,#1f2a1d);--parkink:light-dark(#5b7a4a,#8fb07c);--road:light-dark(#fff,#3a3833);--case:light-dark(#d6d0c4,#151513);--hwy:light-dark(#dbcca5,#5b533c);--waterink:light-dark(#5d8590,#8db3bd)}

*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Nanum Myeongjo",serif;margin:0;line-height:1.1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;min-height:44px;border-radius:10px}

.mapwrap{margin:0 max(4vw,16px);border-radius:16px;overflow:hidden;background:var(--land);position:relative}

.fig>svg{z-index:1}

.ph img,.thumbs img{cursor:zoom-in}
.lb{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;z-index:30;touch-action:none}.lb.on{display:flex}
.lb img{max-width:100vw;max-height:100vh;object-fit:contain;user-select:none;-webkit-user-drag:none}
.lb button{position:absolute;color:#fff;background:#0007;border-radius:50%;width:48px;height:48px;font-size:30px;line-height:1;padding:0}
.lbx{top:max(14px,env(safe-area-inset-top));right:14px}.lbp{left:10px;top:50%;transform:translateY(-50%)}.lbq{right:10px;top:50%;transform:translateY(-50%)}
.lbc{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);color:#fff;font-size:14px;background:#0007;padding:4px 12px;border-radius:999px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;display:none;z-index:20}

@media(max-width:600px){header h1{font-size:30px}}
@media(prefers-reduced-motion:no-preference){.panel{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.4}}}

async function shrink(f){try{const b=await createImageBitmap(f),m=1600,s=Math.min(1,m/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*s);c.height=Math.round(b.height*s);c.getContext('2d').drawImage(b,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(x=>r(x||f),'image/jpeg',.85))}catch{return f}}
function placeForm(p){draft=p;openSheet(`<div class="bar"><h2>${p.id?'가게 수정':'가게 추가'}</h2><button class="btn" data-x>닫기</button></div>
 <label class="f" for="pn">가게 이름</label><input class="in" id="pn" value="${esc(p.n||'')}" placeholder="예: 봉밀가">
 <label class="f" for="pa">동네·주소</label><input class="in" id="pa" value="${esc(p.a||'')}" placeholder="서울 강남구 삼성동">
 <label class="f">지도 위치</label><button class="btn" style="width:100%" data-pick>${p.lat?`위치 지정됨 · 다시 탭하기`:'지도에서 위치 탭하기'}</button>
 <div class="bar" style="margin-top:20px">${p.id?'<button class="btn warn" data-del>삭제</button>':'<span></span>'}<button class="btn pri" data-save>저장</button></div>`);
 const grab=()=>{p.n=$('#pn').value.trim();p.a=$('#pa').value.trim()};
 panel.querySelector('[data-x]').onclick=()=>{draft=null;closeSheet()};
 panel.querySelector('[data-pick]').onclick=()=>{grab();startPick((la,ln)=>{p.lat=+la.toFixed(5);p.lng=+ln.toFixed(5);placeForm(p)})};
 const del=panel.querySelector('[data-del]');if(del)del.onclick=async()=>{if(pv(p.id).length)return toast('이 가게의 기록을 먼저 지워 주세요');await remove(p.id);draft=null;closeSheet()};
 panel.querySelector('[data-save]').onclick=async()=>{grab();if(!p.n)return toast('가게 이름을 적어 주세요');if(!p.lat)return toast('지도에서 위치를 지정해 주세요');
  const id=p.id||'p'+Date.now().toString(36);if(await save(id,{kind:'place',n:p.n,a:p.a||'',lat:p.lat,lng:p.lng})){draft=null;closeSheet();toast('가게를 추가했습니다');openPlace(id)}}}
let lbS=[],lbI=0,lbX0=null;const lb=$('#lb');
function lbShow(){$('#lbImg').src=img(lbS[lbI]);$('#lbC').textContent=`${lbI+1} / ${lbS.length}`;const m=lbS.length>1;$('#lbP').style.display=$('#lbN').style.display=$('#lbC').style.display=m?'':'none'}
function lbOpen(set,i){lbS=set;lbI=i;lbShow();lb.classList.add('on')}
function lbClose(){lb.classList.remove('on');$('#lbImg').removeAttribute('src')}
const lbGo=d=>{if(lbS.length<2)return;lbI=(lbI+d+lbS.length)%lbS.length;lbShow()};
document.addEventListener('click',e=>{const im=e.target.closest('img[data-set]');if(!im)return;e.stopPropagation();lbOpen(im.dataset.set.split(','),+im.dataset.i)},true);
$('#lbX').onclick=lbClose;$('#lbP').onclick=e=>{e.stopPropagation();lbGo(-1)};$('#lbN').onclick=e=>{e.stopPropagation();lbGo(1)};
let lbSw=0;lb.addEventListener('click',e=>{if(lbSw){lbSw=0;return}if(e.target===lb)lbClose()});
lb.addEventListener('pointerdown',e=>{lbX0=e.clientX});lb.addEventListener('pointerup',e=>{if(lbX0!=null&&Math.abs(e.clientX-lbX0)>50){lbSw=1;lbGo(e.clientX<lbX0?1:-1)}lbX0=null});
document.addEventListener('keydown',e=>{if(!lb.classList.contains('on'))return;if(e.key==='Escape'){e.stopImmediatePropagation();lbClose()}if(e.key==='ArrowRight')lbGo(1);if(e.key==='ArrowLeft')lbGo(-1)},true);
$('#addPlace').onclick=()=>placeForm({});
function apply(docs){visits=docs.filter(d=>d.kind==='visit');mine=docs.filter(d=>d.kind==='place').map(d=>({...d,mine:1}));POS={};for(const d of docs)if(d.kind==='pos')POS[d.pid]=d;render();if(sel&&!sheet.classList.contains('on'))openPlace(sel)}
const IDB=(()=>{let p=null;const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('daedongmyeon',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('docs',{keyPath:'id'});d.createObjectStore('photos')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
 const tx=async(st,mode,fn)=>{const d=await open();return new Promise((res,rej)=>{const t=d.transaction(st,mode);const o=t.objectStore(st);const out=fn(o);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);t.onerror=()=>rej(t.error)})};
 return{all:()=>tx('docs','readonly',o=>o.getAll()),put:v=>tx('docs','readwrite',o=>o.put(v)),del:k=>tx('docs','readwrite',o=>o.delete(k)),pput:(k,b)=>tx('photos','readwrite',o=>o.put(b,k)),pall:async()=>{const d=await open();return new Promise((res,rej)=>{const t=d.transaction('photos','readonly'),o=t.objectStore('photos'),out={};const c=o.openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out[cur.key]=cur.value;cur.continue()}else res(out)};c.onerror=()=>rej(c.error)})},pdel:k=>tx('photos','readwrite',o=>o.delete(k))}})();
let DOCS=[];
async function reload(){DOCS=await IDB.all();apply(DOCS)}
assets={upload:async blob=>{const id='ph'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);await IDB.pput(id,blob);PHOTO[id]=URL.createObjectURL(blob);return{id}}};
db=true;col=true;
async function save(id,o){try{await IDB.put({id,...o});await reload();return true}catch(e){toast('저장 실패: '+(e?.message||''));return false}}
async function remove(id){try{const d=DOCS.find(x=>x.id===id);await IDB.del(id);if(d?.photos)for(const p of d.photos){if(!DOCS.some(x=>x.id!==id&&x.photos?.includes(p))){await IDB.pdel(p)}}await reload()}catch{toast('삭제 실패')}}
const b2d=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function exportAll(){toast('백업 파일을 만드는 중…');const ph=await IDB.pall(),photos={};for(const k in ph)photos[k]=await b2d(ph[k]);const blob=new Blob([JSON.stringify({app:'daedongmyeon',v:1,at:new Date().toISOString(),docs:DOCS,photos})],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='대동면지도-백업-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();toast('백업 파일을 저장했습니다')}
async function importAll(file){try{const j=JSON.parse(await file.text());if(j.app!=='daedongmyeon')throw 0;for(const k in j.photos||{}){const b=await (await fetch(j.photos[k])).blob();await IDB.pput(k,b);PHOTO[k]=URL.createObjectURL(b)}for(const d of j.docs||[])await IDB.put(d);await reload();toast('복원했습니다: 기록 '+(j.docs||[]).filter(d=>d.kind==='visit').length+'개')}catch{toast('백업 파일을 읽지 못했습니다')}}
function resetHome(){closeSheet();if(typeof lbClose==='function')lbClose();stopPick();sel=null;const ib=$('#info');ib.hidden=true;ib.innerHTML='';document.body.classList.remove('sel');tab='list';q='';document.querySelectorAll('[data-t]').forEach(x=>x.setAttribute('aria-selected',x.dataset.t==='list'));VW.s=0;zoom='s';render();scrollTo(0,0)}
try{history.scrollRestoration='manual'}catch{}
addEventListener('online',()=>draw());addEventListener('offline',()=>draw());
const splash=$('#splash');function showSplash(){splash.hidden=false;splash.classList.remove('out');showGate()}
const gate=$('#gate');function showGate(){stopMusic();gate.hidden=true;audioInit();playIntro()}
gate.addEventListener('click',()=>{gate.hidden=true;audioInit();playIntro()});
let unlocked=false,actx=null,mbuf=null,msrc=null,mgain=null,musicWant=false;
function audioInit(){try{if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;actx=new C();fetch('music.m4a?v=1').then(r=>r.arrayBuffer()).then(b=>new Promise((res,rej)=>actx.decodeAudioData(b,res,rej))).then(b=>{mbuf=b;if(musicWant)startMusic()}).catch(()=>{})}if(actx.state!=='running'){const sb=actx.createBuffer(1,1,22050),ss=actx.createBufferSource();ss.buffer=sb;ss.connect(actx.destination);ss.start(0);actx.resume().catch(()=>{})}}catch(e){}}
function startMusic(){musicWant=true;if(!actx||!mbuf||msrc)return;try{mgain=actx.createGain();mgain.gain.value=.9;msrc=actx.createBufferSource();msrc.buffer=mbuf;msrc.loop=true;msrc.connect(mgain);mgain.connect(actx.destination);msrc.start(0)}catch(e){msrc=null}}
function stopMusic(){musicWant=false;if(msrc&&mgain&&actx){try{const t=actx.currentTime,s=msrc;mgain.gain.setValueAtTime(mgain.gain.value,t);mgain.gain.linearRampToValueAtTime(0,t+.4);setTimeout(()=>{try{s.stop()}catch(e){}},500)}catch(e){}}msrc=null}
const intro=$('#intro'),spr=intro.querySelector('.spr');let introT=null;
function endIntro(){clearTimeout(introT);try{iv.pause()}catch(e){}if(unlocked&&!muted&&!splash.hidden){audioInit();startMusic()}intro.classList.add('out');setTimeout(()=>{intro.hidden=true},300)}
const iv=$('#introV');iv.addEventListener('ended',()=>endIntro());
function playIntro(){clearTimeout(introT);intro.hidden=false;intro.classList.remove('out');
 try{iv.currentTime=0;iv.muted=false;const pr=iv.play();introT=setTimeout(endIntro,16000);if(pr&&pr.catch)pr.catch(()=>{iv.muted=true;const p2=iv.play();if(p2&&p2.catch)p2.catch(()=>{clearTimeout(introT);playSprite()})});return}catch(e){}
 playSprite()}
function playSprite(){iv.hidden=true;spr.hidden=false;intro.style.background='#fff';const D=[1000,125,125,125,125,125,125,1000];let i=0;
 const step=()=>{spr.style.backgroundPosition=(i/7*100)+'% 0';const d=D[i];i++;introT=setTimeout(i<8?step:endIntro,d)};
 const img=new Image();let started=false;const go=()=>{if(started)return;started=true;step()};img.onload=go;img.onerror=endIntro;img.src='intro.png?v=1';setTimeout(go,1500)}
intro.addEventListener('click',()=>{audioInit();unlocked=true;endIntro()});
showGate();
$('#spStart').onclick=()=>{audioInit();unlocked=true;if(!muted)startMusic();splash.classList.add('out');setTimeout(()=>{splash.hidden=true;draw()},350)};

const ICON_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>',ICON_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z" fill="currentColor"/><path d="m22 9-6 6M16 9l6 6"/></svg>';let muted=false;try{muted=localStorage.getItem('dm_mute')==='1'}catch(e){}
const muteB=$('#muteB');function setMuteUI(){muteB.innerHTML=muted?ICON_OFF:ICON_ON;muteB.setAttribute('aria-label',muted?'음악 켜기':'음악 끄기')}setMuteUI();
muteB.onclick=()=>{muted=!muted;try{localStorage.setItem('dm_mute',muted?'1':'0')}catch(e){}setMuteUI();audioInit();if(muted)stopMusic();else startMusic()};
document.addEventListener('visibilitychange',()=>{if(!actx)return;if(document.hidden){actx.suspend().catch(()=>{})}else if(musicWant){actx.resume().catch(()=>{})}});
function saveSt(){try{sessionStorage.setItem('dm_st',JSON.stringify({lat:VW.lat,lng:VW.lng,s:VW.s,zoom,tab,q,sel}))}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveSt()});addEventListener('pagehide',saveSt);
resetHome();
(()=>{let st;try{st=JSON.parse(sessionStorage.getItem('dm_st')||'null')}catch(e){}if(!st||!st.s)return;
 clearTimeout(introT);try{iv.pause()}catch(e){}intro.hidden=true;splash.hidden=true;stopMusic();
 tab=st.tab||'list';q=st.q||'';zoom=st.zoom||'';document.querySelectorAll('[data-t]').forEach(x=>x.setAttribute('aria-selected',x.dataset.t===tab));
 render();VW.lat=st.lat;VW.lng=st.lng;VW.s=st.s;draw();if(q&&$('#q')){$('#q').value=q;$('#q').dispatchEvent(new Event('input'))}
 if(st.sel&&allPlaces().some(p=>p.id===st.sel))openPlace(st.sel)})();

if('serviceWorker' in navigator){let swReg=null,hadCtl=!!navigator.serviceWorker.controller,pendingReload=false;
 addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{swReg=r;r.update()}).catch(()=>{}));
 document.addEventListener('visibilitychange',()=>{if(!document.hidden&&swReg)swReg.update().catch(()=>{})});
